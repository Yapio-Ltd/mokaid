# Redirect www to the apex domain (single canonical host for SEO).
server {
    listen 80;
    server_name www.mokaid.com;
    return 301 https://mokaid.com$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # Prerendered HTML first ($uri/index.html), then the SPA shell.
    # Snapshots are regenerated on every deploy — never cache them hard.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/index.html /spa.html;
    }

    # SPA shell fallback for app routes (/dashboard, /login, …).
    # Falls back to index.html if the build ran without the prerender step.
    location = /spa.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /spa.html /index.html;
    }

    # Crawler files served statically with correct types.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    # Immutable hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
