# Keep headers at server scope: location add_header suppresses inheritance.
map $uri $mokaid_robots {
    default "";
    ~^/(account|login|signup|desktop/authorize|oauth|auth|dashboard|agents|tasks|projects|knowledge|drive|mail|calendar|analytics|settings|profile|members|integrations|billing)(/|$) "noindex, nofollow";
    /spa.html "noindex, nofollow";
}
map $uri $mokaid_cache {
    default "no-cache, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(account|login|signup|desktop/authorize|oauth|auth)(/|$) "no-store";
    /spa.html "no-store";
}
# OAuth callbacks can contain one-time codes; never forward them as referrers.
map $uri $mokaid_referrer {
    default "strict-origin-when-cross-origin";
    ~^/(account|login|signup|desktop/authorize|oauth|auth)(/|$) "no-referrer";
    /spa.html "no-referrer";
}
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header Cache-Control $mokaid_cache always;
    add_header X-Robots-Tag $mokaid_robots always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy $mokaid_referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # Unknown public URLs must return a real 404, not an indexable SPA shell.
    location / { try_files $uri $uri/index.html =404; }
    # Only recognized application entry paths may use the private SPA shell.
    location ~ ^/(account|login|signup|desktop/authorize|oauth|auth|dashboard|agents|tasks|projects|knowledge|drive|mail|calendar|analytics|settings|profile|members|integrations|billing)(/|$) {
        try_files /spa.html =503;
    }
    location = /spa.html { internal; try_files /spa.html =503; }
    location = /robots.txt { default_type text/plain; }
    location = /sitemap.xml { default_type application/xml; }
    location = /llms.txt { default_type text/plain; }
    location /assets/ { try_files $uri =404; }
}
server {
    listen 80;
    server_name www.mokaid.com;
    return 301 https://mokaid.com$request_uri;
}
