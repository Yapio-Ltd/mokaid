name: Desktop Release Candidate

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate source and freeze signing-tooling revision
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      commit: ${{ steps.source.outputs.commit }}
      tooling_sha: ${{ steps.source.outputs.tooling_sha }}
      public_key: ${{ steps.keys.outputs.public_key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Validate ancestry and freeze reviewed main/prod tooling
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$commit" origin/main; then
            tooling_sha="$(git rev-parse origin/main)"
          else
            git merge-base --is-ancestor "$commit" origin/prod
            tooling_sha="$(git rev-parse origin/prod)"
          fi
          printf 'commit=%s\ntooling_sha=%s\n' "$commit" "$tooling_sha" >> "$GITHUB_OUTPUT"
          printf 'Source commit: %s\nSigning tooling: %s\n' "$commit" "$tooling_sha" >> "$GITHUB_STEP_SUMMARY"
      - id: metadata
        run: python apps/desktop/distribution/ci.py metadata

      - name: Read versioned public update key; unset keys fail closed
        id: keys
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.metadata.outputs.channel }}
        run: |
          set -euo pipefail
          public_key="$(python apps/desktop/distribution/stage_archive.py public-key --channel "$RELEASE_CHANNEL")"
          printf 'public_key=%s\n' "$public_key" >> "$GITHUB_OUTPUT"

  build_macos:
    name: Compile and stage macos-arm64 without signing authority
    needs: metadata
    permissions:
      contents: read
    # No environment or id-token permission in this compilation job.
    runs-on: macos-15
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.archive.outputs.manifest_sha256 }}
    env:
      MOKAID_UPDATE_PUBLIC_KEY: ${{ needs.metadata.outputs.public_key }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
      TOOLING_SHA: ${{ needs.metadata.outputs.tooling_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with: { arch: x64 }
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtwebsockets qtshadertools qtimageformats qttasktree'
          cache: true
      - run: python -m pip install cmake==4.1.0 ninja==1.13.0 conan==2.19.1 -r apps/desktop/distribution/requirements.txt
      - run: python -m unittest discover -s apps/desktop/distribution/tests -v
      - run: python apps/desktop/distribution/ci.py configure-build-test --release
      - run: python apps/desktop/distribution/ci.py stage
      - name: Archive tested stage, preserving bundle modes and symlinks
        id: archive
        shell: bash
        run: |
          python apps/desktop/distribution/stage_archive.py create --stage apps/desktop/build/stage --output unsigned --platform macos-arm64 --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --commit "$SOURCE_COMMIT" --tooling-sha "$TOOLING_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --public-key "$MOKAID_UPDATE_PUBLIC_KEY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: desktop-unsigned-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            unsigned/stage.tar.gz
            unsigned/stage-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: Compile and stage windows-x64 without signing authority
    needs: metadata
    permissions:
      contents: read
    # No environment or id-token permission in this compilation job.
    runs-on: windows-2022
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.archive.outputs.manifest_sha256 }}
    env:
      MOKAID_UPDATE_PUBLIC_KEY: ${{ needs.metadata.outputs.public_key }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
      TOOLING_SHA: ${{ needs.metadata.outputs.tooling_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with: { arch: x64 }
      - uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtwebsockets qtshadertools qtimageformats qttasktree'
          cache: true
      - run: python -m pip install cmake==4.1.0 ninja==1.13.0 conan==2.19.1 -r apps/desktop/distribution/requirements.txt
      - run: python -m unittest discover -s apps/desktop/distribution/tests -v
      - run: python apps/desktop/distribution/ci.py configure-build-test --release
      - run: python apps/desktop/distribution/ci.py stage
      - name: Archive tested stage, preserving bundle modes and symlinks
        id: archive
        shell: bash
        run: |
          python apps/desktop/distribution/stage_archive.py create --stage apps/desktop/build/stage --output unsigned --platform windows-x64 --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --commit "$SOURCE_COMMIT" --tooling-sha "$TOOLING_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --public-key "$MOKAID_UPDATE_PUBLIC_KEY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: desktop-unsigned-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            unsigned/stage.tar.gz
            unsigned/stage-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Approve, verify and sign ${{ matrix.platform }}
    needs: [metadata, build_macos, build_windows]
    # Reviewer approves the source SHA, frozen tooling SHA and exact artifacts.
    environment: desktop-signing-${{ needs.metadata.outputs.channel }}
    permissions:
      contents: read
      actions: read # Download only artifacts from this exact workflow run.
      id-token: write # Only this isolated job may request AWS/Azure signing roles.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            secretVar: MOKAID_MACOS_SIGNING_SECRET_ARN
            artifact_id: ${{ needs.build_macos.outputs.artifact_id }}
            manifest_sha256: ${{ needs.build_macos.outputs.manifest_sha256 }}
          - runner: windows-2022
            platform: windows-x64
            secretVar: MOKAID_WINDOWS_SIGNING_SECRET_ARN
            artifact_id: ${{ needs.build_windows.outputs.artifact_id }}
            manifest_sha256: ${{ needs.build_windows.outputs.manifest_sha256 }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MOKAID_UPDATE_PUBLIC_KEY: ${{ vars.MOKAID_UPDATE_PUBLIC_KEY }}
      MOKAID_SIGNING_SECRET_ARN: ${{ vars[matrix.secretVar] }}
      MOKAID_AZURE_SIGNING_ENDPOINT: ${{ vars.MOKAID_AZURE_SIGNING_ENDPOINT }}
      MOKAID_AZURE_SIGNING_ACCOUNT: ${{ vars.MOKAID_AZURE_SIGNING_ACCOUNT }}
      MOKAID_AZURE_CERTIFICATE_PROFILE: ${{ vars.MOKAID_AZURE_CERTIFICATE_PROFILE }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
      TOOLING_SHA: ${{ needs.metadata.outputs.tooling_sha }}
      STAGE_PLATFORM: ${{ matrix.platform }}
      STAGE_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
    steps:
      - name: Checkout frozen reviewed signing tooling, never artifact scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.tooling_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: Download immutable platform artifact from this exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: unsigned
      - name: Validate identity, manifest, every file and safe paths before import
        shell: bash
        run: |
          python apps/desktop/distribution/stage_archive.py restore --input unsigned --stage apps/desktop/build/stage --platform "$STAGE_PLATFORM" --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --commit "$SOURCE_COMMIT" --tooling-sha "$TOOLING_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --manifest-sha256 "$STAGE_MANIFEST_SHA256" --public-key "$MOKAID_UPDATE_PUBLIC_KEY"
      - name: Install reviewed signing tools; never compile or run the stage
        run: |
          python -m pip install --only-binary=:all: -r apps/desktop/distribution/requirements.txt
      - name: Authenticate to the signing secret manager using OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.MOKAID_SIGNING_AWS_ROLE_ARN }}
          aws-region: ${{ vars.MOKAID_AWS_REGION }}
          role-session-name: desktop-signing-${{ github.run_id }}
      - name: Authenticate to Azure Artifact Signing using OIDC
        if: runner.os == 'Windows'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.MOKAID_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.MOKAID_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.MOKAID_AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Artifact Signing module and Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module -Name TrustedSigning -RequiredVersion '0.5.8' -Force -Repository PSGallery
          choco install innosetup --version=6.5.4 --yes --no-progress
      - name: Sign, notarize and build installer; unsigned releases fail here
        run: python apps/desktop/distribution/ci.py package
      - name: Record deployed runtime inventory
        run: python apps/desktop/distribution/ci.py sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-signed-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/build/release/*.dmg
            apps/desktop/build/release/*.exe
            apps/desktop/build/release/*.json
          if-no-files-found: error
          retention-days: 30

  candidate:
    name: Verify signed platforms and create draft candidate
    needs: [metadata, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create a draft release only; public promotion is separate.
    environment: desktop-signing-${{ needs.metadata.outputs.channel }}
    env:
      GH_TOKEN: ${{ github.token }}
      MOKAID_UPDATE_PUBLIC_KEY: ${{ vars.MOKAID_UPDATE_PUBLIC_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.tooling_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-signed-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-signed-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - run: |
          python -m pip install --only-binary=:all: -r apps/desktop/distribution/requirements.txt
      - run: python apps/desktop/distribution/release.py verify --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --artifacts artifacts
      - name: Create draft candidate without changing public update feeds
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --repo Yapio-Ltd/mokaid --verify-tag --draft --prerelease --generate-notes --title "Mokaid Desktop $RELEASE_VERSION — candidate"
