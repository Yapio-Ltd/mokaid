name: Desktop Promote Verified Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing signed desktop-vX.Y.Z or desktop-vX.Y.Z-beta.N draft; no rebuild'
        required: true
        type: string
      channel:
        description: 'Must match the candidate application identity'
        required: true
        type: choice
        options: [stable, beta]

permissions:
  contents: read

concurrency:
  group: desktop-promote-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  promote:
    # Acceptance records are reviewed on the protected default branch after the
    # candidate is tested. A tag/feature-branch dispatch cannot bypass that review.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Configure required reviewers and protected branch restrictions on these
    # environments. Promotion is the explicit release-operator approval point.
    environment: desktop-public-${{ inputs.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      MOKAID_UPDATE_PUBLIC_KEY: ${{ vars.MOKAID_UPDATE_PUBLIC_KEY }}
      MOKAID_DOWNLOADS_BUCKET: ${{ vars.MOKAID_DOWNLOADS_BUCKET }}
      MOKAID_DOWNLOADS_DISTRIBUTION_ID: ${{ vars.MOKAID_DOWNLOADS_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: python -m pip install -r apps/desktop/distribution/requirements.txt
      - name: Verify signed candidate and mandatory product/hardware acceptance record
        run: python apps/desktop/distribution/promote_candidate.py prepare
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.MOKAID_PUBLISH_AWS_ROLE_ARN }}
          aws-region: ${{ vars.MOKAID_AWS_REGION }}
          role-session-name: desktop-promote-${{ github.run_id }}
      - name: Publish identical verified payloads and advance feeds last
        run: python apps/desktop/distribution/promote_candidate.py publish
