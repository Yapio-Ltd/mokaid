name: Deploy to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod

concurrency:
  group: mokaid-production-deployment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy (${{ inputs.environment || 'prod' }})
    # Keep the Blender/BEAM amd64 build and renderer validation native, as in CI.
    # The API's arm64 variant and other arm64 services use QEMU on this runner.
    runs-on: ubuntu-24.04
    # Includes bounded staging/rollouts plus up to four verified rollbacks.
    timeout-minutes: 180
    environment: prod
    if: >
      vars.AWS_DEPLOY_ENABLED == 'true'
      && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod')
        || (
          github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'prod'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
        )
      )

    env:
      AWS_REGION: il-central-1
      DEPLOY_ENV: ${{ inputs.environment || 'prod' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      DESKTOP_ONLY: ${{ vars.MOKAID_DESKTOP_ONLY || 'false' }}
      AVATAR_PIPELINE: ${{ vars.MOKAID_AVATAR_PIPELINE_ENABLED || 'false' }}
      AWS_PAGER: ''
      DEPLOY_TIMEOUT_SECONDS: '600'
      MIGRATION_TIMEOUT_SECONDS: '600'

    steps:
      - name: Check deploy configuration
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::Missing repository secret AWS_DEPLOY_ROLE_ARN. Run terraform apply in infra/terraform/bootstrap and add the github_deploy_role_arn output."
            exit 1
          fi
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$DESKTOP_ONLY" == true || "$DESKTOP_ONLY" == false ]] || exit 1
          [[ "$AVATAR_PIPELINE" == true || "$AVATAR_PIPELINE" == false ]] || exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate trusted production ALB networks
        env:
          MOKAID_TRUSTED_ALB_CIDRS: ${{ vars.MOKAID_TRUSTED_ALB_CIDRS }}
        run: python3 .github/scripts/ecs_deploy.py validate-trusted-alb

      - name: Require successful CI on this exact production commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/prod" --jq '.sha')" = "$IMAGE_TAG"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$IMAGE_TAG" --branch prod --event push --json conclusion,status \
            | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'

      - name: Verify signed desktop availability before restricting business API clients
        if: env.DESKTOP_ONLY == 'true'
        run: node .github/scripts/check-desktop-ready.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '660601648321'

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Resolve ECR registry
        id: registry
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push API image
        id: api_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          platforms: linux/arm64,linux/amd64
          # Attestation manifests make `docker pull --platform` fail on the
          # staging runner when both arm64 and amd64 are in the same index.
          provenance: false
          tags: ${{ steps.registry.outputs.registry }}/mokaid-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api-deploy
          cache-to: type=gha,scope=api-deploy,mode=max

      - name: Build and push AI worker image
        id: worker_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/ai-worker.Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.registry.outputs.registry }}/mokaid-ai-worker:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=worker-deploy
          cache-to: type=gha,scope=worker-deploy,mode=max

      - name: Build and push Web image
        id: web_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/web.Dockerfile
          # Default target is `runtime` (Playwright prerender for SEO).
          target: runtime
          push: true
          platforms: linux/arm64
          build-args: |
            VITE_API_URL=
            VITE_WS_URL=/socket
          tags: ${{ steps.registry.outputs.registry }}/mokaid-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web-deploy
          cache-to: type=gha,scope=web-deploy,mode=max

      - name: Build and push CRM image
        id: crm_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/crm.Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: ${{ steps.registry.outputs.registry }}/mokaid-crm:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=crm-deploy
          cache-to: type=gha,scope=crm-deploy,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        # The pinned composite action forwards Trivy's CLI environment flags.
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.registry.outputs.registry }}/mokaid-api@${{ steps.api_image.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan avatar worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.registry.outputs.registry }}/mokaid-api@${{ steps.api_image.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify exact avatar worker renderer image without credentials
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-api@${{ steps.api_image.outputs.digest }}
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --entrypoint /opt/blender/blender "$IMAGE"
          --background --factory-startup --python-exit-code 1
          --python-expr 'import bpy, runpy; assert bpy.app.version == (5, 2, 0); [runpy.run_path("/opt/avatar-preparer/" + name, run_name="image_smoke") for name in ("blender-avatar-quality.py", "blender-avatar-life.py", "validate-avatar-life.py", "prepare-custom-avatar.py")]'
      - name: Scan worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.registry.outputs.registry }}/mokaid-ai-worker@${{ steps.worker_image.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.registry.outputs.registry }}/mokaid-web@${{ steps.web_image.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan CRM image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.registry.outputs.registry }}/mokaid-crm@${{ steps.crm_image.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Test exact production images in isolated ephemeral staging
        timeout-minutes: 15
        env:
          STAGING_PLATFORM: linux/arm64
          API_IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-api@${{ steps.api_image.outputs.digest }}
          WEB_IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-web@${{ steps.web_image.outputs.digest }}
          CRM_IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-crm@${{ steps.crm_image.outputs.digest }}
          WORKER_IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-ai-worker@${{ steps.worker_image.outputs.digest }}
          MOKAID_DESKTOP_ONLY_BUSINESS: ${{ env.DESKTOP_ONLY }}
        run: python3 .github/scripts/staging_smoke.py

      - name: Renew short-lived AWS session before production mutations
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '660601648321'
          role-duration-seconds: 3600

      - name: Prepare immutable API revision
        id: api_task
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-api
          CONTAINER: mokaid-${{ env.DEPLOY_ENV }}-api
          IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-api@${{ steps.api_image.outputs.digest }}
          MOKAID_DESKTOP_ONLY_BUSINESS: ${{ env.DESKTOP_ONLY }}
          DESKTOP_AUTH_WEB_BASE_URL: https://mokaid.com
          MOKAID_TRUSTED_ALB_CIDRS: ${{ vars.MOKAID_TRUSTED_ALB_CIDRS }}
          AI_WORKER_URL: http://ai-worker.mokaid-prod.internal:8100
          MESHY_API_KEY_SECRET_ARN: ${{ vars.MESHY_API_KEY_SECRET_ARN }}
          MESHY_WEBHOOK_SECRET_ARN: ${{ vars.MESHY_WEBHOOK_SECRET_ARN }}
          S3_BUCKET_ASSETS_3D: mokaid-assets-3d-prod-660601648321
          MOKAID_AVATAR_WORKER_MODE: api
          MOKAID_AVATAR_PIPELINE_ENABLED: ${{ env.AVATAR_PIPELINE }}
        run: bash .github/scripts/prepare-ecs-task.sh

      - name: Run database migrations
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-api
          CONTAINER: mokaid-${{ env.DEPLOY_ENV }}-api
          TASK_DEFINITION: ${{ steps.api_task.outputs.task_definition }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.api_task.outputs.previous_task_definition }}
        run: bash .github/scripts/run-ecs-migration.sh

      - name: Prepare immutable avatar worker revision
        id: avatar_task
        if: env.AVATAR_PIPELINE == 'true'
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-avatar-worker
          CONTAINER: mokaid-${{ env.DEPLOY_ENV }}-avatar-worker
          IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-api@${{ steps.api_image.outputs.digest }}
        run: bash .github/scripts/prepare-ecs-task.sh

      - name: Deploy avatar worker before enabling generation on API
        if: env.AVATAR_PIPELINE == 'true'
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-avatar-worker
          TASK_DEFINITION: ${{ steps.avatar_task.outputs.task_definition }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.avatar_task.outputs.previous_task_definition }}
        run: bash .github/scripts/deploy-ecs-service.sh

      - name: Deploy API after successful migration
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-api
          TASK_DEFINITION: ${{ steps.api_task.outputs.task_definition }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.api_task.outputs.previous_task_definition }}
        run: bash .github/scripts/deploy-ecs-service.sh

      - name: Prepare immutable worker revision
        id: worker_task
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-ai-worker
          CONTAINER: mokaid-${{ env.DEPLOY_ENV }}-ai-worker
          IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-ai-worker@${{ steps.worker_image.outputs.digest }}
        run: bash .github/scripts/prepare-ecs-task.sh
      - name: Deploy AI worker
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-ai-worker
          TASK_DEFINITION: ${{ steps.worker_task.outputs.task_definition }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.worker_task.outputs.previous_task_definition }}
        run: bash .github/scripts/deploy-ecs-service.sh

      - name: Prepare immutable web revision
        id: web_task
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-web
          CONTAINER: mokaid-${{ env.DEPLOY_ENV }}-web
          IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-web@${{ steps.web_image.outputs.digest }}
        run: bash .github/scripts/prepare-ecs-task.sh
      - name: Deploy web
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-web
          TASK_DEFINITION: ${{ steps.web_task.outputs.task_definition }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.web_task.outputs.previous_task_definition }}
        run: bash .github/scripts/deploy-ecs-service.sh

      - name: Prepare immutable CRM revision
        id: crm_task
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-crm
          CONTAINER: mokaid-${{ env.DEPLOY_ENV }}-crm
          IMAGE: ${{ steps.registry.outputs.registry }}/mokaid-crm@${{ steps.crm_image.outputs.digest }}
        run: bash .github/scripts/prepare-ecs-task.sh
      - name: Deploy CRM
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          SERVICE: mokaid-${{ env.DEPLOY_ENV }}-crm
          TASK_DEFINITION: ${{ steps.crm_task.outputs.task_definition }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.crm_task.outputs.previous_task_definition }}
        run: bash .github/scripts/deploy-ecs-service.sh

      - name: Verify public production endpoints
        id: production_smoke
        run: node .github/scripts/verify-production.mjs

      - name: Renew AWS session for recovery after failure or cancellation
        if: ${{ always() && (failure() || cancelled()) && steps.api_task.outputs.task_definition != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '660601648321'
          role-duration-seconds: 3600

      - name: Restore this deployment's previous revisions after failure or cancellation
        # Cancellation is best-effort: a terminated runner cannot complete recovery.
        if: ${{ always() && (failure() || cancelled()) && steps.api_task.outputs.task_definition != '' }}
        env:
          CLUSTER: mokaid-${{ env.DEPLOY_ENV }}
          AVATAR_TASK: ${{ steps.avatar_task.outputs.task_definition }}
          AVATAR_PREVIOUS: ${{ steps.avatar_task.outputs.previous_task_definition }}
          API_TASK: ${{ steps.api_task.outputs.task_definition }}
          API_PREVIOUS: ${{ steps.api_task.outputs.previous_task_definition }}
          WORKER_TASK: ${{ steps.worker_task.outputs.task_definition }}
          WORKER_PREVIOUS: ${{ steps.worker_task.outputs.previous_task_definition }}
          WEB_TASK: ${{ steps.web_task.outputs.task_definition }}
          WEB_PREVIOUS: ${{ steps.web_task.outputs.previous_task_definition }}
          CRM_TASK: ${{ steps.crm_task.outputs.task_definition }}
          CRM_PREVIOUS: ${{ steps.crm_task.outputs.previous_task_definition }}
          ROLLBACK_TIMEOUT_SECONDS: '600'
        run: |
          export ROLLBACK_BATCH_JSON="$(jq --null-input --compact-output '
            [ {cluster:env.CLUSTER,service:(env.CLUSTER+"-avatar-worker"),task_definition:env.AVATAR_TASK,previous_task_definition:env.AVATAR_PREVIOUS},
              {cluster:env.CLUSTER,service:(env.CLUSTER+"-api"),task_definition:env.API_TASK,previous_task_definition:env.API_PREVIOUS},
              {cluster:env.CLUSTER,service:(env.CLUSTER+"-ai-worker"),task_definition:env.WORKER_TASK,previous_task_definition:env.WORKER_PREVIOUS},
              {cluster:env.CLUSTER,service:(env.CLUSTER+"-web"),task_definition:env.WEB_TASK,previous_task_definition:env.WEB_PREVIOUS},
              {cluster:env.CLUSTER,service:(env.CLUSTER+"-crm"),task_definition:env.CRM_TASK,previous_task_definition:env.CRM_PREVIOUS} ]
            | map(select(.task_definition != "" and .previous_task_definition != ""))')"
          bash .github/scripts/rollback-ecs-batch.sh
