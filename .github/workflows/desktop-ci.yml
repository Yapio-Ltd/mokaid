name: Desktop CI

on:
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop-*.yml', 'assets/optimized/**', 'apps/api/lib/mokaid/assets_3d.ex', 'apps/web/public/**/*.glb', 'apps/web/src/three/office-asset.ts']
  push:
    branches: [main, prod]
    paths: ['apps/desktop/**', '.github/workflows/desktop-*.yml', 'assets/optimized/**', 'apps/api/lib/mokaid/assets_3d.ex', 'apps/web/public/**/*.glb', 'apps/web/src/three/office-asset.ts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: python -m pip install cmake==4.1.0 ninja==1.13.0 -r apps/desktop/distribution/requirements.txt
      - name: Validate release safety and native core
        run: |
          python -m unittest discover -s apps/desktop/distribution/tests -v
          python apps/desktop/scripts/check_boundaries.py
          python -m unittest discover -s apps/desktop/scripts/tests -v
          python apps/desktop/distribution/ci.py cook-assets
          cmake --preset portable-tests -S apps/desktop
          cmake --build apps/desktop/build/portable-tests --parallel 3
          ctest --test-dir apps/desktop/build/portable-tests --output-on-failure
      - name: Exercise portable engine and real packs with ASan and UBSan
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S apps/desktop -B apps/desktop/build/portable-sanitizers -G Ninja \
            -DMOKAID_BUILD_APP=OFF -DMOKAID_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build apps/desktop/build/portable-sanitizers --parallel 3
          ctest --test-dir apps/desktop/build/portable-sanitizers --output-on-failure

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, qt-os: mac, qt-arch: clang_64 }
          - { runner: windows-2022, qt-os: windows, qt-arch: win64_msvc2022_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - name: Select Xcode 26.3 with complete C++20 threading support
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          printf '%s\n' 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer xcodebuild -version
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with: { arch: x64 }
      # Call the pinned Node action directly; the composite wrapper invokes a mutable @v4.
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.2'
          host: ${{ matrix.qt-os }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          # Upstream Qt 6.11 Windows architecture-directory fix; not yet in aqt 3.3.0.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4'
          py7zrversion: '==1.0.0'
          modules: 'qtwebengine qtwebchannel qtpositioning qtwebsockets qtshadertools qtimageformats qttasktree'
          cache: true
      - run: python -m pip install cmake==4.1.0 ninja==1.13.0 conan==2.19.1 -r apps/desktop/distribution/requirements.txt
      - name: Build and test including native updater SDK
        run: python apps/desktop/distribution/ci.py configure-build-test
      - name: Deploy complete unsigned runtime with the tested cooked assets
        run: python apps/desktop/distribution/ci.py stage
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-test-${{ runner.os }}
          path: apps/desktop/build/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
