name: Private macOS Signing Probe

# No tag is created. This is NOT a release candidate or public acceptance run.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed main commit (40 lowercase hex characters)'
        required: true
        type: string
      version:
        description: 'Numeric bundle version for this disposable probe; not a release tag'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-private-macos-signing-probe
  cancel-in-progress: false

jobs:
  build:
    name: Build and test exact main without signing authority
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 100
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      public_key: ${{ steps.identity.outputs.public_key }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.archive.outputs.manifest_sha256 }}
    env:
      PROBE_SOURCE_SHA: ${{ inputs.source_sha }}
      PROBE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - name: Install reviewed build dependencies
        run: python -m pip install cmake==4.1.0 ninja==1.13.0 conan==2.19.1 -r apps/desktop/distribution/requirements.txt
      - name: Fail explicitly unless the source, main and workflow SHA match
        id: identity
        run: python apps/desktop/distribution/macos_signing_probe.py metadata --version "$PROBE_VERSION"
      - name: Select installed Xcode 26.3
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          printf '%s\n' 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.2'
          host: mac
          target: desktop
          arch: clang_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4'
          py7zrversion: '==1.0.0'
          modules: 'qtwebengine qtwebchannel qtpositioning qtwebsockets qtshadertools qtimageformats qttasktree'
          cache: false
      - name: Run offline packaging and probe safety tests
        run: python -m unittest discover -s apps/desktop/distribution/tests -v
      - name: Build real application, updater, assets and run CTest
        env:
          MOKAID_UPDATE_PUBLIC_KEY: ${{ steps.identity.outputs.public_key }}
        run: python apps/desktop/distribution/ci.py configure-build-test --probe-version "$PROBE_VERSION"
      - name: Stage complete unsigned Qt, WebEngine and Sparkle runtime
        run: python apps/desktop/distribution/ci.py stage
      - name: Bind archive bytes to this exact run and attempt
        id: archive
        env:
          MOKAID_UPDATE_PUBLIC_KEY: ${{ steps.identity.outputs.public_key }}
        run: |
          python apps/desktop/distribution/stage_archive.py create --stage apps/desktop/build/stage --output unsigned --platform macos-arm64 --version "$PROBE_VERSION" --channel stable --commit "$PROBE_SOURCE_SHA" --tooling-sha "$PROBE_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --public-key "$MOKAID_UPDATE_PUBLIC_KEY"
      # Public-repository intermediate: NEVER include signed bytes or credentials.
      # Use only after the owner explicitly approves this unsigned transfer.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: desktop-probe-unsigned-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            unsigned/stage.tar.gz
            unsigned/stage-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Approve exact unsigned bytes and notarize privately
    needs: build
    # main must be explicitly allowed here by the owner, with required review.
    # This workflow never changes that environment's deployment policies.
    environment: desktop-signing-stable
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROBE_SOURCE_SHA: ${{ needs.build.outputs.commit }}
      PROBE_VERSION: ${{ needs.build.outputs.version }}
      PROBE_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      MOKAID_UPDATE_PUBLIC_KEY: ${{ vars.MOKAID_UPDATE_PUBLIC_KEY }}
      MOKAID_SIGNING_SECRET_ARN: ${{ vars.MOKAID_MACOS_SIGNING_SECRET_ARN }}
    steps:
      - name: Checkout only the exact reviewed main tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: Install reviewed binary-only signing dependencies, not artifact code
        run: |
          python -m pip install --only-binary=:all: -r apps/desktop/distribution/requirements.txt
      - name: Recheck exact main after the approval wait
        run: python apps/desktop/distribution/macos_signing_probe.py metadata --version "$PROBE_VERSION"
      - name: Download only the current run's immutable unsigned artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: unsigned
      - name: Verify provenance, every byte, paths, links and required runtime before OIDC
        run: python apps/desktop/distribution/macos_signing_probe.py verify-stage --version "$PROBE_VERSION" --input unsigned --manifest-sha256 "$PROBE_MANIFEST_SHA256"
      - name: Assume the approved read-only stable signing role with OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.MOKAID_SIGNING_AWS_ROLE_ARN }}
          aws-region: il-central-1
          role-session-name: desktop-probe-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: '660601648321'
          unset-current-credentials: true
      - name: Sign, notarize, staple and verify ephemeral package; public facts only
        run: python apps/desktop/distribution/macos_signing_probe.py sign --execute --version "$PROBE_VERSION" --input unsigned --manifest-sha256 "$PROBE_MANIFEST_SHA256"
      # Intentionally no upload-artifact, release creation, SBOM upload or feed
      # promotion. The helper removes ALL signed outputs before reporting success.
