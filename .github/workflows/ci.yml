name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, prod]
    paths-ignore:
      - "graphify-out/**"
  pull_request:
    paths-ignore:
      - "graphify-out/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Test
        run: npm run test --workspace=apps/web -- --run

      - name: Test SEO contracts
        run: npm run test:seo --workspace=apps/web

      - name: Test release availability and deployment guards
        run: |
          node --test .github/scripts/check-desktop-ready.test.mjs
          python3 -m unittest discover -s .github/scripts/tests -v

      - name: Build
        run: npm run build --workspace=apps/web

      - name: Install locked Chromium for public-page acceptance
        run: npx playwright install --with-deps chromium

      - name: Verify full public HTML and sitemap
        run: npm run prerender --workspace=apps/web

      - name: Verify compiled account-only portal in Chromium
        working-directory: apps/web
        env:
          VITE_DESKTOP_ONLY_WEB: 'true'
        run: |
          npm run build -- --outDir "$RUNNER_TEMP/account-web"
          node ../../node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5189 --strictPort --outDir "$RUNNER_TEMP/account-web" > "$RUNNER_TEMP/account-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5189/account > /dev/null && break
            kill -0 "$preview_pid"
            sleep 1
          done
          node tests/browser/account-portal.mjs http://127.0.0.1:5189 "$RUNNER_TEMP/account-browser-results"

  crm:
    name: CRM (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/crm

      - name: Build
        run: npm run build --workspace=apps/crm

  api:
    name: API (format, compile, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mokaid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost/mokaid_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            apps/api/deps
            apps/api/_build
          key: mix-${{ runner.os }}-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: mix deps.get

      - name: Check formatting
        working-directory: apps/api
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        working-directory: apps/api
        run: mix compile --warnings-as-errors

      - name: Test
        working-directory: apps/api
        run: mix test

  ai-worker:
    name: AI Worker (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: apps/ai-worker
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/ai-worker
        run: ruff check app tests

      - name: Test
        working-directory: apps/ai-worker
        run: pytest -q

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.7"

      - name: Format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate modules
        run: |
          for dir in infra/terraform/bootstrap/ infra/terraform/environments/*/ infra/terraform/modules/desktop-downloads/ infra/terraform/modules/desktop-signing/; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done
          terraform -chdir=infra/terraform/modules/desktop-downloads test
          terraform -chdir=infra/terraform/modules/desktop-signing test

  deployment-policy:
    name: Deployment policy (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r infra/github/requirements-dev.txt
      - run: python -m pytest -c infra/github/pyproject.toml infra/github/tests --cov=reconcile --cov-branch --cov-fail-under=90
      - run: python -m mypy --config-file infra/github/pyproject.toml infra/github/reconcile.py
      - run: python -m ruff check infra/github

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [web, crm, api, ai-worker, terraform, deployment-policy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build AI worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/ai-worker.Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          push: false
          load: true
          tags: mokaid-web:ci-validation
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Verify production nginx image before deployment
        env:
          MOKAID_SMOKE_ORIGIN: http://127.0.0.1:8418
        run: |
          docker run --detach --name mokaid-web-ci-validation --publish 127.0.0.1:8418:80 mokaid-web:ci-validation
          trap 'docker rm --force mokaid-web-ci-validation' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8418/healthz > /dev/null && break
            sleep 1
          done
          node .github/scripts/verify-production.mjs

      - name: Build CRM image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/crm.Dockerfile
          push: false
          cache-from: type=gha,scope=crm
          cache-to: type=gha,scope=crm,mode=max
