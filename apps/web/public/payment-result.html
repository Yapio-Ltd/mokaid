<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Payment — Mokaid</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0d16;
        color: #e8e6f2;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        text-align: center;
        padding: 24px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 14px;
        border: 3px solid rgba(124, 92, 255, 0.25);
        border-top-color: #7c5cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        font-size: 13px;
        color: #9b97b0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <p id="msg">Finalizing your payment…</p>
    </div>
    <script>
      (function () {
        var status =
          new URLSearchParams(window.location.search).get("payment") === "done"
            ? "done"
            : "failed";

        if (window.parent && window.parent !== window) {
          // Embedded checkout: hand the outcome to the app (same origin).
          window.parent.postMessage(
            { source: "mokaid-checkout", status: status },
            window.location.origin
          );
        } else {
          // Fallback when Tranzila was opened as a full page.
          window.location.replace("/billing?payment=" + status);
        }
      })();
    </script>
  </body>
</html>
