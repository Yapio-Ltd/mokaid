<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <!--
      Send signed-in visitors to the app before anything renders, so the
      prerendered landing snapshot never flashes while the SPA bundle loads.
      Crawlers have no session and always get the marketing page.
      Mirrors shouldSkipLanding() in src/lib/session-entry.ts — keep in sync.
    -->
    <script>
      (function () {
        try {
          if (location.pathname !== "/") return;
          if (new URLSearchParams(location.search).has("landing")) return;
          var stored = localStorage.getItem("mokaid-auth");
          if (stored && JSON.parse(stored).state.token) location.replace("/dashboard");
        } catch (err) {
          /* No session readable — fall through to the landing page. */
        }
      })();
    </script>
    <meta name="description" content="Hire autonomous AI employees you can actually see. mokaid is the AI Workforce OS: a real-time 3D virtual office where your AI agents work, collaborate, and report to you." />
    <title>mokaid | AI Employees in a 3D Virtual Office — AI Workforce OS</title>
    <!-- Open Graph / WhatsApp / social link previews (per-page values set by useSeo) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mokaid.com/" />
    <meta property="og:site_name" content="mokaid" />
    <meta property="og:title" content="mokaid | AI Employees in a 3D Virtual Office — AI Workforce OS" />
    <meta property="og:description" content="Hire autonomous AI employees you can actually see. mokaid is the AI Workforce OS: a real-time 3D virtual office where your AI agents work, collaborate, and report to you." />
    <meta property="og:image" content="https://mokaid.com/branding/og-image-wide.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="mokaid — AI employees working in a 3D virtual office" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mokaid | AI Employees in a 3D Virtual Office — AI Workforce OS" />
    <meta name="twitter:description" content="Hire autonomous AI employees you can actually see. mokaid is the AI Workforce OS: a real-time 3D virtual office where your AI agents work, collaborate, and report to you." />
    <meta name="twitter:image" content="https://mokaid.com/branding/og-image-wide.jpg" />
    <!-- Non-blocking font CSS (media=print swap) — avoids render-blocking stylesheet chain -->
    <link rel="preconnect" href="https://rsms.me/" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://rsms.me/inter/inter.css"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"

      media="print"

        rel="stylesheet"

  </head>
